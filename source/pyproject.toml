[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-cut-fbbm"
version = "0.1.0"
description = "Table-driven exact drama cutting, technical QC, OSS delivery and Facebook BM sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "oss2>=2.18.0",
  "Pillow>=10.0.0",
  "pydantic>=2.7.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
prepare = ["scenedetect>=0.6.4", "opencv-python>=4.10.0"]
dev = ["pytest>=8.0.0", "pytest-xdist>=3.6"]

[project.scripts]
exactcut = "exactcut.cli:main"

[tool.setuptools.packages.find]
include = ["exactcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is the unit layer. Full suite: -m "" ; see tests/conftest.py.
addopts = "-q --strict-markers -m 'not ui and not integration'"
markers = [
  "unit: pure logic; no browser, no ffmpeg/ffprobe, no real media (default layer)",
  "ui: starts a Playwright browser",
  "integration: runs ffmpeg/ffprobe or processes real media; run before merging to main or releasing",
  "flaky_fs: depends on filesystem timestamp granularity; known flaky",
]


[tool.setuptools.package-data]
exactcut = ["hook_visual_styles.json", "web/index.html", "web/app.js", "web/helper.js", "web/diagnostics.js", "web/editor-source.js", "web/editor-busy.js", "web/cutting.js", "web/mosaic.js", "web/preview-subtitles.js", "help/*.json", "fonts/*", "title_image/*.mjs", "assets/brand/*.png", "web/brand-style.jpg"]
