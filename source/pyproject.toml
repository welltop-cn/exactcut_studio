[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-cut-fbbm"
version = "0.1.0"
description = "Table-driven exact drama cutting, technical QC, OSS delivery and Facebook BM sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "oss2>=2.18.0",
  "Pillow>=10.0.0",
  "pydantic>=2.7.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
prepare = ["scenedetect>=0.6.4", "opencv-python>=4.10.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
exactcut = "exactcut.cli:main"

[tool.setuptools.packages.find]
include = ["exactcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.setuptools.package-data]
exactcut = ["hook_visual_styles.json", "web/index.html", "web/app.js", "web/helper.js", "web/cutting.js", "web/mosaic.js", "help/*.json", "fonts/*"]
