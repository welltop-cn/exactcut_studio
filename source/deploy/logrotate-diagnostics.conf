# Default deployment root. Run hourly via cron; state file is separate from system logrotate.
/srv/exactcut/data/logs/nginx-access.log {
    daily
    maxsize 20M
    rotate 14
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    create 0600 root root
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen
    endscript
}
