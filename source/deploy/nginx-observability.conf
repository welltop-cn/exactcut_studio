# Install in nginx's http context (conf.d). No query, body, cookie or credentials.
# Enable on the Exact Cut server only:
# access_log /srv/exactcut/data/logs/nginx-access.log exactcut_diagnostic;
log_format exactcut_diagnostic escape=json
    '{"at":"$time_iso8601","event":"proxy.request",'
    '"method":"$request_method","route":"$uri","status":$status,'
    '"duration_seconds":"$request_time","upstream_seconds":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","trace_id":"$upstream_http_x_request_id",'
    '"bytes":$body_bytes_sent}';
