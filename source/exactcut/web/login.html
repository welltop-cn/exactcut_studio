<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · OULA 素材工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f6;color:#152c39;font:15px -apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(420px,90vw);background:white;border:1px solid #dce5e8;border-radius:16px;padding:36px}h1{font-size:24px}p{color:#657a87;line-height:1.7}label{display:block;margin:20px 0 8px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #cddcde;border-radius:8px}button{margin-top:26px;background:#087f77;color:white;cursor:pointer;font-weight:600}#error{color:#ad443a}</style><main><strong>OULA / EXACT CUT</strong><h1>登录素材工作台</h1><p>制作项目独立管理，原片与 FBBM 共享。</p><form id="login"><label for="username">账户</label><input id="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">登录</button><p id="error" role="alert"></p></form><p>账户由管理员创建。忘记密码请联系管理员。</p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Exactcut-Request':'1'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const b=await r.json();if(!r.ok)throw Error(b.error);localStorage.removeItem('exactcut.batch');location.replace(document.baseURI)}catch(e){document.getElementById('error').textContent=e.message}finally{button.disabled=false}};</script></html>
